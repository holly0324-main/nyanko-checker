<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="にゃんこ所持">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>にゃんこ超激レア所持チェッカー</title>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">非コラボ・超激レア</div>
      <h1>所持チェッカー</h1>
    </div>
    <button id="settingsBtn" class="iconbtn" aria-label="設定">⚙︎</button>
  </header>

  <main>
    <section class="summary-card">
      <button id="groupBtn" class="group-button">
        <span><small>表示中</small><strong id="groupName">全キャラ</strong></span><span>⌄</span>
      </button>
      <div class="count-row">
        <div><span id="ownedCount">0</span><small>所持</small></div>
        <div class="slash">/</div>
        <div><span id="totalCount">0</span><small>体</small></div>
        <div class="meter"><i id="meterBar"></i></div>
      </div>
    </section>

    <section class="controls sticky-controls">
      <div class="segmented" role="group" aria-label="所持状態フィルター">
        <button data-status="all" class="active">すべて</button>
        <button data-status="owned">所持</button>
        <button data-status="unowned">未所持</button>
      </div>
      <label class="search"><span>⌕</span><input id="searchInput" type="search" inputmode="search" placeholder="名前 / No."></label>
    </section>

    <section id="grid" class="character-grid" aria-live="polite"></section>
    <div id="empty" class="empty hidden">該当キャラなし</div>
  </main>

  <div id="sheetBackdrop" class="backdrop hidden"></div>
  <section id="groupSheet" class="sheet hidden" aria-modal="true" role="dialog">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><h2>ガチャ / シリーズ</h2><button id="closeSheet" class="iconbtn">×</button></div>
    <button class="group-option active" data-group="all"><span>全キャラ</span><b id="allGroupCount"></b></button>
    <div id="groupOptions"></div>
  </section>

  <section id="settingsModal" class="modal hidden" aria-modal="true" role="dialog">
    <div class="modal-card">
      <div class="sheet-head"><h2>データ管理</h2><button id="closeSettings" class="iconbtn">×</button></div>
      <p class="muted">所持状況はこの端末に自動保存されます。</p>
      <button id="backupBtn" class="wide primary">バックアップを書き出す</button>
      <label class="wide file-label">バックアップから復元<input id="restoreInput" type="file" accept="application/json,.json"></label>
      <hr>
      <div class="info-list">
        <div><span>アプリ版</span><b id="appVersion"></b></div>
        <div><span>キャラデータ</span><b id="snapshot"></b></div>
        <div><span>登録キャラ</span><b id="masterCount"></b></div>
      </div>
      <p class="tiny">画像はにゃんこ大戦争DBの第1形態画像を参照します。表示済み画像は対応ブラウザでキャッシュされます。</p>
    </div>
  </section>

  <div id="toast" class="toast hidden"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
